<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d10" />
    <title>Times — Placar Analítico</title>
    <meta name="description" content="Busque times e veja elenco, resultados e estatísticas." />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2300e07a'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://www.thesportsdb.com" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />

    <script src="js/config.js"></script>
    <script>
      (function () {
        try {
          var reg = JSON.parse(localStorage.getItem(CONFIG.responsavel.chaveArmazenamento) || 'null');
          var valido = reg && reg.em && Date.now() - reg.em < CONFIG.responsavel.validadeDias * 86400000;
          if (!valido) document.documentElement.classList.add('bloqueado');
        } catch (e) {
          document.documentElement.classList.add('bloqueado');
        }
      })();
    </script>
  </head>

  <body data-pagina="times">
    <div id="cabecalho"></div>

    <main class="pagina">
      <div class="secao-cabecalho">
        <h1 class="secao-titulo">Times</h1>
        <p class="secao-sub">Busque pelo nome ou escolha uma competição para ver todos os times dela.</p>
      </div>

      <section class="filtros" aria-label="Busca de times">
        <div class="filtros-linha">
          <div class="campo">
            <label class="campo-rotulo" for="f-busca">Nome do time</label>
            <input type="search" id="f-busca" placeholder="Ex.: Flamengo, Arsenal, Lakers…" />
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="f-esporte">Esporte</label>
            <select id="f-esporte"></select>
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="f-liga">Competição</label>
            <select id="f-liga">
              <option value="">Escolha uma competição</option>
            </select>
          </div>

          <div class="campo">
            <label class="campo-rotulo" aria-hidden="true">&nbsp;</label>
            <button type="button" class="btn btn-principal" id="f-buscar">Buscar</button>
          </div>
        </div>
      </section>

      <div id="avisos"></div>
      <div class="grade" id="resultados"></div>
    </main>

    <div id="rodape"></div>

    <script src="js/cache.js"></script>
    <script src="js/api.js"></script>
    <script src="js/modelo.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/times.js"></script>
  </body>
</html>
