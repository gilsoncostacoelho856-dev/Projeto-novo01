<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d10" />
    <title>Jogador — Placar Analítico</title>
    <meta name="description" content="Ficha e estatísticas disponíveis do jogador." />
    <meta name="robots" content="noindex" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2300e07a'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://www.thesportsdb.com" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />

    <script src="js/config.js"></script>
    <script>
      (function () {
        try {
          var reg = JSON.parse(localStorage.getItem(CONFIG.responsavel.chaveArmazenamento) || 'null');
          var valido = reg && reg.em && Date.now() - reg.em < CONFIG.responsavel.validadeDias * 86400000;
          if (!valido) document.documentElement.classList.add('bloqueado');
        } catch (e) {
          document.documentElement.classList.add('bloqueado');
        }
      })();
    </script>
  </head>

  <body data-pagina="jogador">
    <div id="cabecalho"></div>

    <main class="pagina" id="conteudo">

    </main>

    <div id="rodape"></div>

    <script src="js/cache.js"></script>
    <script src="js/api.js"></script>
    <script src="js/estatisticas.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/jogador.js"></script>
  </body>
</html>
