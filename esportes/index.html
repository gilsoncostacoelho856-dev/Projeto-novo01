<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d10" />
    <title>Placar Analítico — jogos e análise estatística</title>
    <meta
      name="description"
      content="Próximos jogos, resultados ao vivo e análise estatística de partidas. Conteúdo informativo para maiores de 18 anos."
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2300e07a'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://www.thesportsdb.com" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />

    <!-- A configuracao vem antes de tudo: o portao de idade le dela. -->
    <script src="js/config.js"></script>
    <script>
      /* Marca o documento como bloqueado ANTES de qualquer pintura.
         Sem isto, o conteudo apareceria por uma fracao de segundo
         antes do modal 18+ montar. O CSS esconde tudo enquanto a
         classe existir. */
      (function () {
        try {
          var reg = JSON.parse(localStorage.getItem(CONFIG.responsavel.chaveArmazenamento) || 'null');
          var valido = reg && reg.em && Date.now() - reg.em < CONFIG.responsavel.validadeDias * 86400000;
          if (!valido) document.documentElement.classList.add('bloqueado');
        } catch (e) {
          document.documentElement.classList.add('bloqueado');
        }
      })();
    </script>
  </head>

  <body data-pagina="home">
    <div id="cabecalho"></div>

    <main class="pagina">
      <h1 class="so-leitor">Jogos e análise estatística</h1>

      <!-- ---------------------------------------------- filtros -->
      <section class="filtros" aria-label="Filtros">
        <div class="filtros-linha">
          <div class="campo">
            <label class="campo-rotulo" for="f-esporte">Esporte</label>
            <select id="f-esporte"></select>
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="f-liga">Competição</label>
            <select id="f-liga">
              <option value="">Todas as competições</option>
            </select>
          </div>

          <div class="campo">
            <label class="campo-rotulo" for="f-data">Data</label>
            <input type="date" id="f-data" />
          </div>

          <div class="campo">
            <label class="campo-rotulo" aria-hidden="true">&nbsp;</label>
            <button type="button" class="btn btn-principal" id="f-atualizar">Atualizar</button>
          </div>
        </div>

        <div class="chips" id="atalhos-liga" role="group" aria-label="Competições em destaque"></div>
      </section>

      <div id="avisos"></div>

      <!-- ---------------------------------------------- ao vivo -->
      <section class="secao" id="secao-vivo" hidden>
        <div class="secao-cabecalho">
          <h2 class="secao-titulo">
            <span class="ponto-vivo"></span>
            Ao vivo agora
          </h2>
          <p class="secao-sub">Placar atualizado automaticamente enquanto a página estiver aberta.</p>
        </div>
        <div class="grade" id="lista-vivo"></div>
      </section>

      <!-- ------------------------------------------------ jogos -->
      <section class="secao">
        <div class="secao-cabecalho">
          <h2 class="secao-titulo" id="titulo-jogos">Jogos do dia</h2>
          <p class="secao-sub" id="sub-jogos">Escolha o esporte, a competição e a data nos filtros acima.</p>
        </div>
        <div class="grade" id="lista-jogos"></div>
        <div id="area-mais" style="margin-top: 14px; text-align: center"></div>
      </section>
    </main>

    <div id="rodape"></div>

    <script src="js/cache.js"></script>
    <script src="js/api.js"></script>
    <script src="js/modelo.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
